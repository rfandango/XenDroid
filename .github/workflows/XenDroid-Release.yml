name: XenDroid Release

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    env:
      ANDROID_NDK_VERSION: 27.2.12479018
      ANDROID_PLATFORM: android-35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      ##################################################################
      # JDK 21
      ##################################################################
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      ##################################################################
      # Python
      ##################################################################
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      ##################################################################
      # Android SDK + NDK + CMake
      ##################################################################
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Components
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.30.3"

      ##################################################################
      # Vulkan SDK
      ##################################################################
      - name: Install Vulkan tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            glslang-tools \
            spirv-tools

      - name: Verify Vulkan Tools
        run: |
          glslangValidator --version
          spirv-opt --version
          spirv-dis --version

      ##################################################################
      # local.properties
      ##################################################################
      - name: Generate local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          echo "cmake.dir=$ANDROID_SDK_ROOT/cmake/3.30.3" >> local.properties

      ##################################################################
      # Restore keystore
      ##################################################################
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      ##################################################################
      # Build
      ##################################################################
      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      ##################################################################
      # Sign APK
      ##################################################################
      - name: Sign APK
        run: |
          APK=$(find . -name "*release*.apk" | head -n 1)

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            "$APK"

      - name: Verify APK Signature
        run: |
          APK=$(find . -name "*release*.apk" | head -n 1)
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify "$APK"

      ##################################################################
      # Rename APK
      ##################################################################
      - name: Get Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          APK=$(find . -name "*release*.apk" | head -n 1)
          mv "$APK" "XenDroid_Release_${{ steps.vars.outputs.sha_short }}.apk"

      ##################################################################
      # Upload Artifact (PR + main)
      ##################################################################
      - name: Upload Artifact
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: XenDroid_Release_${{ steps.vars.outputs.sha_short }}
          path: XenDroid_Release_${{ steps.vars.outputs.sha_short }}.apk
          retention-days: 30

      ##################################################################
      # Publish GitHub Release (only tags)
      ##################################################################
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: XenDroid_Release_${{ steps.vars.outputs.sha_short }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}