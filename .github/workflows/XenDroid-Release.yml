name: XenDroid Release
on:
  push:
    tags:
      - 'v*'
jobs:
  build-release:
    runs-on: ubuntu-24.04

    env:
      ANDROID_NDK_VERSION: 27.2.12479018
      ANDROID_PLATFORM: android-35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      ##################################################################
      # JDK 21
      ##################################################################
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      ##################################################################
      # Python
      ##################################################################
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      ##################################################################
      # Android SDK + NDK + CMake
      ##################################################################
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Components
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.30.3"

      ##################################################################
      # Vulkan SDK
      ##################################################################
      - name: Install Vulkan SDK
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/lunarg.gpg

          echo "deb [signed-by=/usr/share/keyrings/lunarg.gpg] \
          https://packages.lunarg.com/vulkan/latest/lunarg-vulkan-jammy.list" \
          | sudo tee /etc/apt/sources.list.d/lunarg-vulkan.list

          sudo apt update
          sudo apt install -y vulkan-sdk

      - name: Verify SPIR-V Tools
        run: |
          glslangValidator --version
          spirv-opt --version
          spirv-dis --version

      ##################################################################
      # local.properties
      ##################################################################
      - name: Generate local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          echo "cmake.dir=$ANDROID_SDK_ROOT/cmake/3.30.3" >> local.properties

      ##################################################################
      # Restore keystore
      ##################################################################
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" \
            | base64 -d > release.keystore

      ##################################################################
      # Build Release
      ##################################################################
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      ##################################################################
      # Sign APK
      ##################################################################
      - name: Sign APK
        run: |
          APK=$(find . -name "*release*.apk" | head -n 1)

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            "$APK"

      - name: Verify Signature
        run: |
          APK=$(find . -name "*release*.apk" | head -n 1)

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify "$APK"

      ##################################################################
      # Upload artifact
      ##################################################################
      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          APK=$(find . -name "*release*.apk" | head -n 1)
          mv "$APK" "XenDroid_Release_${{ steps.vars.outputs.sha_short }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XenDroid_Release_${{ steps.vars.outputs.sha_short }}
          path: XenDroid_Release_${{ steps.vars.outputs.sha_short }}.apk